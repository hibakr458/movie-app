<div class="container">
    <div class="poster-container">
        <img [src]="'https://image.tmdb.org/t/p/original/' + selectedMovie()?.poster_path" alt="">
    </div>

    <div class="details-container">
        
    <div class="detail-item">
    <h3>Original title</h3><p>{{selectedMovie()?.original_title}}</p>
    </div>
    <div class="detail-item">
    <h3>Original language</h3><p>{{selectedMovie()?.original_language}}</p>
    </div>
    <div class="detail-item">
    <h3>Release date</h3><p>{{selectedMovie()?.release_date}}</p>
    </div>
    <div class="detail-item">
    <h3>Vote average</h3><p>{{selectedMovie()?.vote_average}}</p>
    </div>
    <div class="detail-item">
    <h3>Vote count</h3><p>{{selectedMovie()?.vote_count}}</p>
    </div>
    <div class="overview-container">
    <p class="detail">{{selectedMovie()?.overview}}</p>
    </div>
    <div class="button-container">
        <button (click)="backToMovieList()">Back to movie list</button>
        <button (click)="addToWish(selectedMovie())">Add to Wishlist</button>
        </div>
    </div>
</div>
